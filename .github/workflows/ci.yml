name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - run: python -m ruff check gateway tests scripts
      - run: python scripts/check_publication.py
      - run: python -m pytest -q
      - run: python -m pip check
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t passerelle-chatgpt:ci .
      - name: Start and probe local container
        shell: bash
        run: |
          docker run -d --name gateway -p 127.0.0.1:8787:8787 passerelle-chatgpt:ci
          trap 'docker logs gateway; docker rm -f gateway' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz; then
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/v1/models)" = 401
              exit 0
            fi
            sleep 1
          done
          exit 1

