name: passerelle-chatgpt
services:
  gateway:
    image: passerelle-chatgpt:0.4.0
    build: .
    restart: unless-stopped
    init: true
    environment:
      GW_HOST: 0.0.0.0
      GW_PORT: 8787
      GW_DATA_DIR: /data
      GW_PROVIDER: chatgpt_oauth
      GW_ALLOWED_HOSTS: '${GW_ALLOWED_HOSTS:-["127.0.0.1","localhost","::1"]}'
      GW_TRUSTED_PROXY_CIDRS: '[]'
      GW_CATALOG_TTL_SECONDS: 30
      GW_MAX_BODY_BYTES: 16777216
    ports:
      - '${GATEWAY_BIND_IP:-127.0.0.1}:8787:8787'
    volumes:
      - gateway_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  gateway_data:
